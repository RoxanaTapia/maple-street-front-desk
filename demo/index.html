<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Maple Street Front Desk</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="wrap">
    <h1>Maple Street Front Desk</h1>
    <p class="demo">This is a demo. It answers only from Maple Street's pages.</p>
    <div id="thread" class="thread" aria-live="polite"></div>
    <form id="composer" class="composer">
      <label for="message">Message</label>
      <p id="message-hint" class="hint">Press Enter to send. Shift+Enter adds a new line.</p>
      <div class="row">
        <textarea id="message" name="message" rows="2" aria-describedby="message-hint"></textarea>
        <button id="send" type="submit">Send</button>
      </div>
    </form>
  </main>
  <script src="chat.js"></script>
</body>
</html>
