name: Automated tests

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

# One job per test area. Copy a job, set the plain-English name, and point
# the command at a test file or a file and class (tests/test_pages.py:PageListChecks).

jobs:
  project-setup:
    name: Project setup is in place
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - name: Run automated tests
        run: python3 scripts/run_checks.py tests/test_checks.py

  doc-links:
