name: Board labels

on:
  pull_request:

permissions:
  contents: read
  issues: write

jobs:
  now-description:
    name: Now description is current work
    runs-on: ubuntu-latest
    steps:
      - name: Set the Now description
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh label edit "Now" --repo "$GITHUB_REPOSITORY" --description "Current work. Filter with is:open label:Now."
